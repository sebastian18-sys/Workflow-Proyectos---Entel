server {
    listen 80;
    server_name workflowgcir.entel.net.pe www.workflowgcir.entel.net.pe;
    return 301 https://workflowgcir.entel.net.pe$request_uri;
}

server {
    listen 443 ssl;
    server_name workflowgcir.entel.net.pe www.workflowgcir.entel.net.pe;

    ssl_certificate     /etc/nginx/certs/_entel.net.pe_2027.crt;
    ssl_certificate_key /etc/nginx/certs/entel.net.pe_2027.key;

    charset utf-8;
    server_tokens off;
    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-scheme $scheme;
    }

    location /gcir-api/ {
        proxy_pass http://10.30.17.57:89/gcir/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    include /etc/nginx/extra-conf.d/*.conf;
}